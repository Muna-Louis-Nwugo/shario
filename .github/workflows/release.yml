name: Release

# Builds release binaries and attaches them to a GitHub Release whenever a
# version tag (e.g. v0.1.0) is pushed -- including a tag created through
# GitHub's own website, not just `git push --tags`; both trigger this the
# same way.
#
# Each target runs on its own native OS/arch runner rather than
# cross-compiling -- avoids the MSVC cross-compile problem entirely (ring's
# C code needing the real Windows headers). Windows 10 and Windows 11 use
# the same Rust target per architecture (there's no separate "Windows 10"
# target), so one x86_64 build and one arm64 build cover both.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 10 + 11, x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: shario.exe
            artifact: shario-windows-x64.exe
          # Windows 10 + 11, arm64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            bin: shario.exe
            artifact: shario-windows-arm64.exe
          # macOS, Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: shario
            artifact: shario-macos-arm64
          # macOS, Intel
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bin: shario
            artifact: shario-macos-x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.bin }} ${{ matrix.artifact }}

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
