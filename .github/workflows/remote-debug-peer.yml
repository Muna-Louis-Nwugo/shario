name: Remote Debug Peer

# A genuinely separate machine to join a live shar session for debugging --
# GitHub's own runner hardware, real internet routing, no relationship to
# anyone's local dev environment (unlike e.g. a WSL sandbox, which looks
# "remote" but isn't). Builds from the current branch, not a release
# binary, so it always reflects whatever fix is being tested, released or
# not.
#
# workflow_dispatch only -- never runs on push/PR/schedule. Only a human
# with write access to this repo can start it, from the Actions tab or
# `gh workflow run remote-debug-peer.yml`.
on:
  workflow_dispatch:
    inputs:
      session_name:
        description: "Shar session name to join"
        required: true
        type: string
      mode:
        description: "Join an existing session, or create a new one"
        required: true
        type: choice
        options: [participate, create]
        default: participate
      file_path:
        description: "File (relative to the shar root) to read/type into"
        required: true
        type: string
        default: test.txt
      message:
        description: "If set, types this message into file_path after joining"
        required: false
        type: string
      duration_seconds:
        description: "How long to stay connected and log incoming edits afterward"
        required: false
        type: number
        default: 120

jobs:
  join:
    runs-on: ubuntu-latest
    env:
      # passed as env vars, not interpolated straight into `run:` scripts --
      # inputs.message in particular is free-text and could otherwise break
      # out of a shell command (quotes, `$(...)`, etc.) if templated in directly
      SESSION_NAME: ${{ inputs.session_name }}
      MODE: ${{ inputs.mode }}
      FILE_PATH: ${{ inputs.file_path }}
      MESSAGE: ${{ inputs.message }}
      DURATION_SECONDS: ${{ inputs.duration_seconds }}
    steps:
      - uses: actions/checkout@v4

      # checked out separately so client.js can run the real, shipped
      # extension.js against a fake-vscode.js shim -- rendering actual
      # reconstructed document text, not just raw event logs. Never modified.
      - uses: actions/checkout@v4
        with:
          repository: Muna-Louis-Nwugo/shario-vscode
          path: shario-vscode-repo

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install shario-vscode's dependencies
        run: npm install
        working-directory: shario-vscode-repo

      # installed at the repo root, not inside runner_test -- runner_test is
      # the shar root, and SharDirectory::new() walks every file under it
      # with no exclusions (node_modules included); confirmed this alone
      # made a real join never complete (see info/TODO.md). Node still
      # resolves require("socket.io-client") from debug_client.js (which
      # runs with cwd=runner_test) by walking up to this node_modules.
      - name: Install socket.io-client
        run: npm install socket.io-client

      # client.js owns the whole server lifecycle itself -- cargo build,
      # spawn, wait for the port -- so there's no cross-step timing gap
      # between "server becomes reachable" and "a local IDE joins it".
      # Backgrounded (disowned, since each `run:` block is its own shell)
      # so it stays connected and listening for the whole test window,
      # writing the actual reconstructed document to client_output.txt on
      # every change, rather than connecting fresh at the end and hoping to
      # catch up on everything that already happened.
      - name: Start the client
        run: |
          node .github/scripts/remote-debug/client.js "." "shario-vscode-repo" "$MODE" "$SESSION_NAME" \
            3000 "runner_test" "$FILE_PATH" "client_output.txt" "server_ready" "$DURATION_SECONDS" \
            > client.log 2>&1 &
          echo $! > client.pid
          disown

      - name: Wait for the client's server to come up
        run: |
          # cargo build's own "Compiling ..." progress output is buffered
          # (not line-buffered) once stdout isn't a TTY -- client.log
          # inheriting a regular file counts -- so if something kills the
          # whole process group outright (OOM, say) mid-build, all of that
          # buffered output is lost and client.log shows only whatever our
          # own console.log calls already flushed. That'd look identical to
          # a build that failed instantly, so dump memory/OOM evidence here
          # rather than guess which one actually happened.
          dump_diagnostics() {
            echo "=== free -h ==="
            free -h || true
            echo "=== dmesg (oom/kill evidence) ==="
            (sudo dmesg --ctime 2>/dev/null || dmesg --ctime 2>/dev/null) | grep -iE "killed process|out of memory|oom" | tail -n 40
            echo "=== listening sockets ==="
            ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null || true
            echo "=== shario process ==="
            ps aux | grep -i shario | grep -v grep || true
            echo "=== client.log ==="
            cat client.log || true
          }
          for i in $(seq 1 120); do
            [ -f server_ready ] && echo "server is up" && exit 0
            kill -0 "$(cat client.pid)" 2>/dev/null || { echo "client.js exited before the server came up"; dump_diagnostics; exit 1; }
            sleep 1
          done
          echo "server never came up"
          dump_diagnostics
          exit 1

      - name: Write the debug client script
        run: |
          cat > runner_test/debug_client.js <<'EOF'
          const { io } = require("socket.io-client");
          const path = require("path");

          const DIR = path.resolve(process.argv[2]);
          const FILE_REL = process.argv[3];
          const MESSAGE = process.argv[4] || "";
          const DURATION_MS = parseInt(process.argv[5], 10) * 1000;
          const FILE = path.join(DIR, FILE_REL);

          const socket = io("http://127.0.0.1:3000", { transports: ["websocket"] });

          // Reconstructs actual document text from "network-add"/"network-remove"
          // events (which carry real character values, unlike "initial-state"'s
          // bare identity tags). Mirrors shario-vscode/extension.js's own model
          // exactly (findByIdentity + applyNetworkAdd/applyNetworkRemove). Not
          // meant to replace the raw [network-add]/[network-remove] logs above,
          // just to make the actual document state readable at a glance
          // alongside them.
          //
          // "initial-state" carries real values now, not just identities
          // (see shario-vscode/extension.js's own file-level comment on
          // why) -- this script never had a local file to trust anyway, so
          // it always scraps and rebuilds from this directly.
          let lines = [{ anchor: { id: 0, peer: 0 }, cells: [] }];

          function buildInitialState(serverLines) {
            return serverLines.map(([anchorInfo, ...cellInfos]) => ({
              anchor: { id: anchorInfo[0], peer: anchorInfo[1] },
              cells: cellInfos.map(([id, peer, value]) => ({ value, id, peer })),
            }));
          }

          function findByIdentity(id, peer) {
            for (let row = 0; row < lines.length; row++) {
              const line = lines[row];
              if (line.anchor.id === id && line.anchor.peer === peer) {
                return { kind: "anchor", row };
              }
              for (let col = 0; col < line.cells.length; col++) {
                if (line.cells[col].id === id && line.cells[col].peer === peer) {
                  return { kind: "cell", row, col };
                }
              }
            }
            return null;
          }

          function applyNetworkAdd(data) {
            const { id, peer, relation } = data.crdt;
            const parentPos = findByIdentity(relation.parent_id, relation.parent_peer);
            if (!parentPos) return;

            const insertIdx = parentPos.kind === "anchor" ? 0 : parentPos.col + 1;

            if (relation.value === "\n") {
              const line = lines[parentPos.row];
              const moved = line.cells.splice(insertIdx);
              lines.splice(parentPos.row + 1, 0, { anchor: { id, peer }, cells: moved });
              return;
            }

            lines[parentPos.row].cells.splice(insertIdx, 0, { value: relation.value, id, peer });
          }

          function applyNetworkRemove(data) {
            const pos = findByIdentity(data.id, data.peer);
            if (!pos || pos.kind !== "cell") return;
            lines[pos.row].cells.splice(pos.col, 1);
          }

          function reconstructText() {
            return lines.map((line) => line.cells.map((cell) => cell.value).join("")).join("\n");
          }

          let lastParentId = null;
          let lastParentPeer = null;
          let tagCounter = 0;
          const pendingTags = new Map();
          let charIndex = 0;

          function sendNextChar() {
            if (!MESSAGE || charIndex >= MESSAGE.length) {
              if (MESSAGE) console.log("[done typing]");
              return;
            }
            const ch = MESSAGE[charIndex];
            const tag = tagCounter++;
            pendingTags.set(tag, ch);
            socket.emit("ide-add", {
              file_path: FILE,
              parent_id: lastParentId,
              parent_peer: lastParentPeer,
              parent_tag: null,
              val: ch,
              tag,
              line_hint: 0,
            });
            console.log(`[sending] "${ch}" (tag=${tag}, parent=(${lastParentId},${lastParentPeer}))`);
          }

          socket.on("connect", () => {
            console.log("[connected] joining local for", DIR);
            socket.emit("join", { local: true, path: DIR });
          });

          socket.on("connect_error", (err) => console.log("[connect_error]", err.message));

          socket.on("initial-state", (data) => {
            if (data.file_path !== FILE) return;
            console.log("[initial-state]", JSON.stringify(data.lines));
            lines = buildInitialState(data.lines);
            console.log("[document]", JSON.stringify(reconstructText()));

            const lastLine = data.lines[data.lines.length - 1];
            const lastEntry = lastLine[lastLine.length - 1];
            [lastParentId, lastParentPeer] = lastEntry;
            sendNextChar();
          });

          socket.on("ide-add-confirmed", (data) => {
            const ch = pendingTags.get(data.tag);
            if (ch === undefined) return;
            pendingTags.delete(data.tag);
            console.log(`[confirmed] "${ch}" -> id=${data.id} peer=${data.peer}`);
            lastParentId = data.id;
            lastParentPeer = data.peer;
            charIndex++;
            sendNextChar();
          });

          socket.on("ide-add-failed", (data) => console.log("[ide-add-failed]", JSON.stringify(data)));
          socket.on("network-add", (data) => {
            console.log("[network-add]", JSON.stringify(data));
            applyNetworkAdd(data);
            console.log("[document]", JSON.stringify(reconstructText()));
          });
          socket.on("network-remove", (data) => {
            console.log("[network-remove]", JSON.stringify(data));
            applyNetworkRemove(data);
            console.log("[document]", JSON.stringify(reconstructText()));
          });

          setTimeout(() => {
            console.log("[duration elapsed, exiting]");
            process.exit(0);
          }, DURATION_MS);
          EOF

      - name: Run debug client
        working-directory: runner_test
        run: |
          node debug_client.js "$(pwd)" "$FILE_PATH" "$MESSAGE" "$DURATION_SECONDS"

      - name: Check server liveness
        run: |
          if kill -0 "$(cat client.pid)" 2>/dev/null; then
            echo "client (and its server) still alive (pid $(cat client.pid))"
          else
            echo "client is NOT alive anymore (pid $(cat client.pid)) -- it or its server died sometime during this run"
          fi

      # client.js has been connected and listening since right after its own
      # server came up -- wait for its own DURATION_SECONDS listen window to
      # finish, then show what it actually captured live.
      - name: Wait for the client and show what it captured
        run: |
          if [ -f client.pid ]; then
            # client.js listens for DURATION_SECONDS internally, plus its own
            # build/startup/printing overhead -- wait generously, not a fixed
            # guess, or a long build or DURATION_SECONDS would get cut off
            # here before client.js ever exits on its own.
            for i in $(seq 1 $((DURATION_SECONDS + 60))); do
              kill -0 "$(cat client.pid)" 2>/dev/null || break
              sleep 1
            done
          fi
          echo "=== reconstructed document (client_output.txt) ==="
          cat client_output.txt || true
          echo "=== full client.log ==="
          cat client.log || true

      - name: Shut down
        if: always()
        run: |
          [ -f client.pid ] && kill "$(cat client.pid)" 2>/dev/null || true
