[package]
name = "shario"
version = "0.1.0"
edition = "2024"


[dependencies]
axum = "0.8.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
socketioxide = {version = "0.18.3", features = ["state"]}
thiserror = "1"
tokio = {version = "1.51.0", features = ["macros", "rt-multi-thread", "fs",  "test-util", "time"]}
tower = "0.5.3"
tower-http = { version = "0.6.11", features = ["cors"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
petname = "3.2.0"
iroh = "1.3.0"
iroh-gossip = "0.101.0"
rand = "0.10.3"
futures-lite = "2.6.1"
iroh-net = "0.28.2"
data-encoding = "2.11.1"
tracing-appender = "0.2.5"
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
redis = { version = "1.7.1", features = ["tls-native-tls"] }

